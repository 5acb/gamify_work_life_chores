# Project Context — gamify_work_life_chores
# Read this file FIRST in any new chat session, then run orientation_commands.
# Last updated: 2025-07-26

project:
  name: gamify_work_life_chores
  domain: 7ay.de
  description: >
    Personal task organizer with dependency tracking, subtasks, progress bars,
    timeline view, multi-user boards, and advanced Gemini AI orchestration.
    The interface is an Atmospheric Sanctuary—a 2:1 split-pane interface 
    fusing skeuomorphic glass aesthetics with an oceanic palette and 
    domain-specific materials managed via a dynamic domains system.
  repo: https://github.com/5acb/gamify_work_life_chores
  infra_repo: https://github.com/5acb/7ay_de_infra (private)

server:
  ip: 164.92.90.91
  provider: DigitalOcean SFO3
  os: Ubuntu 24.04 LTS
  node: v22
  domain: 7ay.de
  ssl: Let's Encrypt (auto-renew)
  deploy_user: deploy
  repo_path: /opt/organizer/repo

architecture:
  overview: >
    Split-file SPA frontend (Vanilla JS/CSS) + Express REST API + SQLite WAL. 
    AI integration uses gemini-3.5-flash for direct UI chat and a 
    dedicated MCP Server for autonomous agent workflows, tool execution, 
    and complex planning sessions.
  ui_paradigm: >
    Atmospheric Sanctuary. Uses 2:1 split pane (Worktree vs Task List). 
    Features Donut Indicators for temporal frequency and a Sanctuary Indicator Line. 
    Custom reordering via Sortable.js. Domains utilize specific "Materials" 
    mapped via the domains table: Threat Intelligence (CTI: cyberspace-grid), 
    Drone Security (CSD: kingfisher), Enterprise Security (ECM: saffron-road), 
    Graduate Research (GRA: amethyst-sky), Personal (PER: sun-baked-clay). 
    Background rendering utilizes HGT Digital Elevation Model data (terrain/S36E149.DAT).
  ai_orchestration: >
    A dedicated MCP server (SSE transport) provides a tool-augmented environment.
    1. Subagent framework: Specialized personas (Plan, Execute, Review) in subagents.js.
    2. Plan Sessions: Multi-step workflows for decomposition and state analysis,
       persisted in plan_sessions, session_events, and session_decisions.
    3. Meta Insights: Automated generation of domain-specific insights and evidence.
    4. Knowledge Base: Integration with Mem0 (localhost:8000) for long-term memory.
    5. Auditability: A cryptographic changelog (changelog.js) logs all AI mutations.
    6. Agentic CLI: npx @google/gemini-cli --yolo for autonomous terminal tasks.
  ports:
    3000: "App server (Express + SQLite) — proxied by Nginx on /"
    3001: "commit-daemon (socat localhost-only) — proxied on /api/commit"
    3002: "MCP server (SSE transport, token auth) — proxied on /mcp"
  auth_flow: >
    WebAuthn (Passkeys) primary access via @simplewebauthn/server. 
    Fallback: Argon2-hashed passwords. Sessions are HMAC-signed using a 
    persistent secret in /opt/organizer/data/.session_secret.
    RP ID: 7ay.de; RP Name: 7ay.de Sanctuary; Origin: https://7ay.de.
  security:
    - "Timing-safe HMAC session verification"
    - "WebAuthn (Passkeys) with hardware authenticator support"
    - "Argon2 for salted password hashing"
    - "CSP header: default-src 'self'; script-src 'self' cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline';"
    - "Audit logging: task_events table and cryptographic changelog.js"
    - "CSRF protection via X-Requested-With header requirement"
  database:
    engine: SQLite (WAL mode, foreign_keys ON)
    path: /opt/organizer/data/organizer.db
    orm: none — raw SQL via better-sqlite3
    backup: "cron every 7min → scripts/backup.sh → /opt/organizer/data/backups/"

services:
  organizer.service: "Main Express app and task API"
  organizer-mcp.service: "MCP Server (SSE) for AI tool execution"
  organizer-commit.service: "Socat-based commit-daemon for changelog audit"

subagents:
  Plan: "Decomposes high-level objectives into task structures and identifies dependencies."
  Execute: "Performs file system operations, database mutations, and code generation."
  Review: "Validates outcomes against session goals and generates meta-insights."

files:
  JOURNEY.md: "Narrative chronicle of the Sanctuary UI evolution"
  DESIGN.md: "Foundational Design Laws for the Sanctuary"
  GEMINI.md: "AI integration and prompt engineering documentation"
  KICKSTART.md: "Quickstart guide for environment setup"
  TODO.md: "Project roadmap and pending features"
  README.md: "Project overview and entry point"
  schema.sql: "Full database schema definitions"
  backup.sql: "Database dump for recovery/migration"
  mcp-server/server.js: "MCP Server — SSE transport, Tool definitions, Gemini Agent logic"
  mcp-server/subagents.js: "Specialized AI personas (Plan, Execute, Review)"
  mcp-server/changelog.js: "Cryptographic audit trail for AI actions"
  mcp-server/icon.png: "MCP server branding"
  mcp-server/package.json: "MCP server dependencies"
  public/app.js: "Frontend JS — Sanctuary rendering, task logic, AI chat"
  public/changelog.html: "Visual interface for the cryptographic audit trail"
  public/index.html: "Main entry point for the Sanctuary UI"
  public/style.css: "Atmospheric Sanctuary styles and material definitions"
  public/vendor/Sortable.min.js: "Drag-and-drop reordering library"
  public/vendor/simplewebauthn-browser.min.js: "WebAuthn client-side library"
  server.js: "Express API — WebAuthn, task persistence, Gemini Direct Invoke, domain management"
  package.json: "Main app dependencies and scripts"
  scripts/backup.sh: "Automated database backup script"
  scripts/kb.py: "Knowledge base / Mem0 integration scripts"
  scripts/kb-pyproject.toml: "Python dependencies for KB scripts"
  scripts/post-session-kb.sh: "Post-session hook for KB synchronization"
  scripts/setup-mcp-client.sh: "Utility to configure local MCP clients"
  scripts/test-render.sh: "Canvas/UI rendering test utility"
  terrain/S36E149.DAT: "HGT Digital Elevation Model data for backgrounds"
  .gemini/settings.json: "Gemini CLI and agent configuration"

database_schema:
  users:
    id: "INTEGER PRIMARY KEY"
    name: "TEXT NOT NULL"
    slug: "TEXT UNIQUE NOT NULL"
    password_hash: "TEXT"
    created_at: "TEXT DEFAULT (datetime('now'))"
  credentials:
    id: "TEXT PRIMARY KEY"
    user_id: "INTEGER NOT NULL REFERENCES users(id)"
    public_key: "BLOB NOT NULL"
    counter: "INTEGER NOT NULL DEFAULT 0"
    transports: "TEXT"
    created_at: "TEXT DEFAULT (datetime('now'))"
  auth_challenges:
    user_id: "INTEGER NOT NULL REFERENCES users(id) PRIMARY KEY"
    challenge: "TEXT NOT NULL"
    expires_at: "INTEGER NOT NULL"
  domains:
    id: "INTEGER PRIMARY KEY AUTOINCREMENT"
    user_id: "INTEGER NOT NULL REFERENCES users(id)"
    name: "TEXT NOT NULL"
    slug: "TEXT NOT NULL"
    material: "TEXT NOT NULL"
    sort_order: "INTEGER DEFAULT 0"
    unique: "(user_id, slug)"
  tasks:
    id: "INTEGER PRIMARY KEY"
    domain: "TEXT NOT NULL"
    name: "TEXT NOT NULL"
    plan_date: "TEXT"
    due_date: "TEXT"
    plan_label: "TEXT"
    due_label: "TEXT"
    speed: "INTEGER DEFAULT 0"
    stakes: "INTEGER DEFAULT 0"
    sort_order: "INTEGER DEFAULT 0"
    done: "INTEGER DEFAULT 0"
    archived: "INTEGER DEFAULT 0"
    archived_at: "TEXT"
    user_id: "INTEGER REFERENCES users(id) DEFAULT 1"
    created_at: "TEXT DEFAULT (datetime('now'))"
    updated_at: "TEXT DEFAULT (datetime('now'))"
  subtasks:
    id: "INTEGER PRIMARY KEY"
    task_id: "INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE"
    label: "TEXT NOT NULL"
    done: "INTEGER DEFAULT 0"
    sort_order: "INTEGER DEFAULT 0"
    created_at: "TEXT DEFAULT (datetime('now'))"
  blockers:
    task_id: "INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE"
    blocked_by: "INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE"
    primary_key: "(task_id, blocked_by)"
  task_events:
    id: "INTEGER PRIMARY KEY"
    task_id: "INTEGER NOT NULL REFERENCES tasks(id) ON DELETE CASCADE"
    user_id: "INTEGER NOT NULL REFERENCES users(id)"
    action: "TEXT NOT NULL"
    detail: "TEXT"
    ts: "TEXT DEFAULT (datetime('now'))"
  ui_state:
    key: "TEXT PRIMARY KEY"
    value: "TEXT"
  plan_sessions:
    id: "TEXT PRIMARY KEY"
    triggered: "TEXT"
    domain: "TEXT"
    task_ids: "TEXT"
    started_at: "TEXT"
    ended_at: "TEXT"
    task_snapshot: "TEXT"
  session_events:
    id: "INTEGER PRIMARY KEY AUTOINCREMENT"
    session_id: "TEXT REFERENCES plan_sessions(id)"
    ts: "TEXT"
    agent: "TEXT"
    event_type: "TEXT"
    task_id: "INTEGER"
    content: "TEXT"
  session_decisions:
    id: "INTEGER PRIMARY KEY AUTOINCREMENT"
    session_id: "TEXT REFERENCES plan_sessions(id)"
    ts: "TEXT"
    decision_type: "TEXT"
    task_id: "INTEGER"
    proposed_by: "TEXT"
    accepted: "INTEGER"
    outcome_validated: "INTEGER"
    rationale: "TEXT"
  task_observations:
    id: "INTEGER PRIMARY KEY AUTOINCREMENT"
    task_id: "INTEGER"
    session_id: "TEXT REFERENCES plan_sessions(id)"
    ts: "TEXT"
    observer: "TEXT"
    observation: "TEXT"
    content: "TEXT"
    task_state_snap: "TEXT"
  meta_insights:
    id: "INTEGER PRIMARY KEY AUTOINCREMENT"
    generated_at: "TEXT"
    insight_type: "TEXT"
    domain: "TEXT"
    content: "TEXT"
    evidence: "TEXT"
    confidence: "REAL"
    surfaced: "INTEGER DEFAULT 0"
  indexes:
    - "idx_tasks_archived ON tasks(archived)"
    - "idx_tasks_domain ON tasks(domain)"
    - "idx_task_events_task ON task_events(task_id)"
    - "idx_task_events_user ON task_events(user_id, ts)"
    - "idx_session_events_session ON session_events(session_id)"
    - "idx_session_events_task ON session_events(task_id)"
    - "idx_session_decisions_session ON session_decisions(session_id)"
    - "idx_task_observations_task ON task_observations(task_id)"
    - "idx_meta_insights_domain ON meta_insights(domain)"
    - "idx_meta_insights_surfaced ON meta_insights(surfaced)"
